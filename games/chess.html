CK=[['No clock',0,0],['Bullet 1+0',1,0],['Blitz 3+2',3,2],['Rapid 10+0',10,0],['Custom']],
MN=[1,2,3,5,10,15,30,60],IN=[0,1,2,3,5,10,15,30],
o={m:0,c:0,l:2,k:0,mi:3,ii:0,s:1,e:1,a:0,g:0,il:0,bi:0};

/* ---------- engine ---------- */
function sq(i){return 'abcdefgh'.charAt(i&7)+(8-(i>>3))}
function init(){var b=[],i,k=[4,2,3,5,6,3,2,4];for(i=0;i<64;i++)b[i]=0;
for(i=0;i<8;i++){b[i]=-k[i];b[8+i]=-1;b[48+i]=1;b[56+i]=k[i]}
return{b:b,t:1,c:15,ep:-1,h:0,n:1}}
function att(b,i,by){var r=i>>3,c=i&7,k,j,d,nr,nc,p;
nr=r+by;for(d=-1;d<2;d+=2){nc=c+d;if(nc>=0&&nc<8&&nr>=0&&nr<8&&b[nr*8+nc]==by)return 1}
for(k=0;k<8;k++){nr=r+D[k][0];nc=c+D[k][1];if(nr>=0&&nr<8&&nc>=0&&nc<8&&b[nr*8+nc]==2*by)return 1;
nr=r+K8[k][0];nc=c+K8[k][1];if(nr>=0&&nr<8&&nc>=0&&nc<8&&b[nr*8+nc]==6*by)return 1;
for(j=1;;j++){nr=r+K8[k][0]*j;nc=c+K8[k][1]*j;if(nr<0||nr>7||nc<0||nc>7)break;p=b[nr*8+nc];
if(p){if(p*by>0&&(Math.abs(p)==5||Math.abs(p)==(k<4?4:3)))return 1;break}}}
return 0}
function mv(o,f,t,pr,e){if(pr){for(var x=5;x>1;x--)o.push({f:f,t:t,p:x})}else o.push({f:f,t:t,e:e})}
function gen(s){var o=[],b=s.b,t=s.t,i,r,c,p,a,k,j,nr,nc,q,st,bs,e;
for(i=0;i<64;i++){p=b[i]*t;if(p<=0)continue;r=i>>3;c=i&7;
if(p==1){nr=r-t;st=t>0?6:1;e=nr==(t>0?0:7);
if(!b[nr*8+c]){mv(o,i,nr*8+c,e);if(r==st&&!b[(nr-t)*8+c])mv(o,i,(nr-t)*8+c)}
for(a=-1;a<2;a+=2){nc=c+a;if(nc<0||nc>7)continue;q=nr*8+nc;if(b[q]*t<0)mv(o,i,q,e);else if(q==s.ep)mv(o,i,q,0,1)}}
else if(p==2||p==6){a=p==2?D:K8;
for(k=0;k<8;k++){nr=r+a[k][0];nc=c+a[k][1];if(nr<0||nr>7||nc<0||nc>7)continue;q=nr*8+nc;if(b[q]*t<=0)mv(o,i,q)}
if(p==6){bs=t>0?56:0;e=-t;
if(i==bs+4&&(s.c&(t>0?1:4))&&!b[bs+5]&&!b[bs+6]&&b[bs+7]==4*t&&!att(b,bs+4,e)&&!att(b,bs+5,e)&&!att(b,bs+6,e))mv(o,i,bs+6,0,2);
if(i==bs+4&&(s.c&(t>0?2:8))&&!b[bs+1]&&!b[bs+2]&&!b[bs+3]&&b[bs]==4*t&&!att(b,bs+4,e)&&!att(b,bs+3,e)&&!att(b,bs+2,e))mv(o,i,bs+2,0,2)}}
else{for(k=p==3?4:0;k<(p==4?4:8);k++)for(j=1;;j++){nr=r+K8[k][0]*j;nc=c+K8[k][1]*j;if(nr<0||nr>7||nc<0||nc>7)break;q=nr*8+nc;
if(b[q]*t>0)break;mv(o,i,q);if(b[q])break}}}
return o}
function ap(s,m){var b=s.b.slice(),p=b[m.f],t=s.t,ep=-1,h=s.h+1;
if(Math.abs(p)==1||b[m.t])h=0;
b[m.t]=m.p?m.p*t:p;b[m.f]=0;
if(m.e==1)b[(m.f>>3)*8+(m.t&7)]=0;
if(m.e==2){if(m.t>m.f){b[m.t-1]=b[m.t+1];b[m.t+1]=0}else{b[m.t+1]=b[m.t-2];b[m.t-2]=0}}
if(!m.x&&Math.abs(p)==1&&Math.abs(m.t-m.f)==16)ep=(m.f+m.t)>>1;
return{b:b,t:-t,c:s.c&~((M[m.f]||0)|(M[m.t]||0)),ep:ep,h:h,n:s.n+(t<0?1:0)}}
function inchk(s,col){var k=s.b.indexOf(6*col);return k<0?0:att(s.b,k,-col)}
function fm(s,f,t,q){var L=gen(s),i,m;if(f==t||s.b[f]*s.t<=0||s.b[t]*s.t>0)return null;
for(i=0;i<L.length;i++)if(L[i].f==f&&L[i].t==t&&(!L[i].p||L[i].p==(q||5)))return L[i];
m={f:f,t:t,x:1};if(Math.abs(s.b[f])==1&&((t>>3)==0||(t>>3)==7))m.p=q||5;return m}
function allm(s){var o=gen(s),k={},i,t,m;for(i=0;i<o.length;i++)k[o[i].f*64+o[i].t]=1;
for(i=0;i<64;i++){if(s.b[i]*s.t<=0)continue;for(t=0;t<64;t++){if(t==i||s.b[t]*s.t>0||k[i*64+t])continue;m={f:i,t:t,x:1};if(Math.abs(s.b[i])==1&&((t>>3)==0||(t>>3)==7))m.p=5;o.push(m)}}return o}
function perm(s){return mode=='pvp'?ill:(s.t==me?ill:bi)}
function mvs(s){return perm(s)?gen(s):leg(s)}
function leg(s){var a=gen(s),o=[],i;for(i=0;i<a.length;i++)if(!inchk(ap(s,a[i]),s.t))o.push(a[i]);return o}
function fen(s,sh){var o='',r,c,e,p,i=0,x,cs_;
for(r=0;r<8;r++){e=0;for(c=0;c<8;c++){p=s.b[i++];if(!p)e++;else{if(e)o+=e;e=0;x='PNBRQK'.charAt(Math.abs(p)-1);o+=p>0?x:x.toLowerCase()}}if(e)o+=e;if(r<7)o+='/'}

o+=' '+(s.t>0?'w':'b')+' '+(cs_||'-')+' '+(s.ep>=0?sq(s.ep):'-');

function san(s,m,L){var p=Math.abs(s.b[m.f]),x='',i,q,am=0,sf=0,sr=0,n;
if(m.e==2)x=m.t>m.f?'O-O':'O-O-O';
else{if(p==1){if(s.b[m.t]||m.e==1)x='abcdefgh'.charAt(m.f&7)+'x'}
else{x='PNBRQK'.charAt(p-1);
for(i=0;i<L.length;i++){q=L[i];if(q!=m&&q.t==m.t&&Math.abs(s.b[q.f])==p){am=1;if((q.f&7)==(m.f&7))sf=1;if((q.f>>3)==(m.f>>3))sr=1}}
if(am){if(!sf)x+='abcdefgh'.charAt(m.f&7);else if(!sr)x+=(8-(m.f>>3));else x+=sq(m.f)}
if(s.b[m.t])x+='x'}
x+=sq(m.t);if(m.p)x+='='+'PNBRQK'.charAt(m.p-1)}

function ev0(b){var i,p,a,v=0,x;for(i=0;i<64;i++){p=b[i];if(!p)continue;a=p<0?-p:p;x=V[a];
if(a==1)x+=(p>0?6-(i>>3):(i>>3)-1)*6;else if(a==2||a==3)x+=10-3*Math.max(Math.abs((i>>3)-3.5),Math.abs((i&7)-3.5));

function nega(s,d,a,b){if(d==0)return s.t*ev0(s.b);
var ms=gen(s),i,v,best=-99999,bd=s.b;
for(i=0;i<ms.length;i++)if(Math.abs(bd[ms[i].t])==6)return 20000+d;
ms.sort(function(x,y){return Math.abs(bd[y.t])*10-Math.abs(bd[y.f])-(Math.abs(bd[x.t])*10-Math.abs(bd[x.f]))});
if(!ms.length)return 0;
for(i=0;i<ms.length;i++){v=-nega(ap(s,ms[i]),d-1,-b,-a);if(v>best)best=v;if(best>a)a=best;if(a>=b)break}

function think(s){var L=bi?allm(s):mvs(s),i,v,best=-1e9,bm=L[0],d=bi?2:lvl-1,nz=lvl==2?80:lvl==3?20:5;
for(i=0;i<L.length;i++)if(Math.abs(s.b[L[i].t])==6)return L[i];

for(i=0;i<L.length;i++){v=-nega(ap(s,L[i]),d-1,-1e9,1e9)+Math.random()*nz;if(v>best){best=v;bm=L[i]}}
return bm}

/* ---------- game state ---------- */
function res(n){var s=ST[n],i,f=fen(s,1),c=0,mn=0,oth=0,p;
if(flag&&n==MV.length)return{r:flag>0?'0-1':'1-0',m:(flag>0?'White':'Black')+' ran out of time'};
var kw=s.b.indexOf(6)<0,kb=s.b.indexOf(-6)<0;
if(kw||kb)return{r:kw?'0-1':'1-0',m:(kw?'White':'Black')+' king captured'};
if(!mvs(s).length)return perm(s)||!inchk(s,s.t)?{r:'1/2-1/2',m:'Stalemate'}:{r:s.t>0?'0-1':'1-0',m:'Checkmate'};
if(s.h>=100)return{r:'1/2-1/2',m:'Draw, 50 move rule'};
for(i=0;i<=n;i++)if(fen(ST[i],1)==f)c++;
if(c>=3)return{r:'1/2-1/2',m:'Draw, repetition'};
for(i=0;i<64;i++){p=Math.abs(s.b[i]);if(p==2||p==3)mn++;else if(p&&p!=6)oth++}
if(!oth&&mn<2)return{r:'1/2-1/2',m:'Draw, insufficient material'};

function now(){return new Date().getTime()}
function tick(){if(!cl||!MV.length||R)return;var n=now(),i=ST[ix].t>0?0:1;tm[i]-=n-lt;lt=n;
if(tm[i]<=0){tm[i]=0;flag=i?-1:1;render()}}
function play(m){var s=ST[ix],L=mvs(s),sn=san(s,m,L),n=ap(s,m);
if(cl&&MV.length){tick();tm[s.t>0?0:1]+=inc}
ST.length=ix+1;MV.length=ix;SN.length=ix;ST.push(n);MV.push(m);SN.push(sn);ix++;
sel=-1;tg=[];pend=null;lt=now();note='';
anim=sk?null:{m:m};sk=0;if(ar&&mode=='pvp'){flip=n.t<0;anim=null}
render();
if(mode=='bot'&&n.t!=me&&!R)setTimeout(bot,AN?260:40)}
function xhr(f,d,cb){var x,dn=0,fn=function(r){if(!dn){dn=1;cb(r)}};
try{x=new XMLHttpRequest();x.open('POST','https://chess-api.com/v1',true);x.setRequestHeader('Content-Type','application/json');
x.onreadystatechange=function(){if(x.readyState==4){var r=null;try{r=JSON.parse(x.responseText)}catch(e){}fn(r&&r.winChance!=null?r:null)}};
x.onerror=function(){fn(null)};x.send(JSON.stringify({fen:f,depth:d}));setTimeout(function(){fn(null)},10000)}catch(e){fn(null)}}
function uci(s,u){var L=leg(s),i,m,q=u.length>4?'xxnbrq'.indexOf(u.charAt(4)):0;
for(i=0;i<L.length;i++){m=L[i];if(sq(m.f)+sq(m.t)==u.substr(0,4)&&(m.p||0)==q)return m}return null}
function bot(){var s=ST[ix],id=++bid;if(R||s.t==me)return;busy=1;side();
var fin=function(m){if(id!=bid)return;busy=0;if(m)play(m);else side()};
if(cloud&&!bi)xhr(fen(s),CD[lvl-1],function(d){if(id!=bid)return;var m=d&&d.move?uci(s,d.move):null;
if(d)EC[fen(s,1)]=d;if(!m){note='Cloud unavailable, used built-in engine';m=think(s)}fin(m)});
else setTimeout(function(){if(id==bid)fin(think(s))},30)}
function pick(i){if(R||pend||busy||flag)return;var s=ST[ix],k,ms=[];
if(mode=='bot'&&s.t!=me)return;
if(sel>=0&&perm(s)&&i!=sel&&s.b[i]*s.t<=0){
if(Math.abs(s.b[sel])==1&&((i>>3)==0||(i>>3)==7)){pend=[5,4,3,2].map(function(q){return fm(s,sel,i,q)});render()}else play(fm(s,sel,i));return}
if(sel>=0){for(k=0;k<tg.length;k++)if(tg[k].t==i)ms.push(tg[k]);
if(ms.length){if(ms[0].p){pend=ms;render()}else play(ms[0]);return}}
sel=-1;tg=[];
if(s.b[i]*s.t>0){sel=i;tg=mvs(s).filter(function(m){return m.f==i})}
render()}
function pp(i){if(pend)play(pend[i])}
function go(d){var n=ix+d;if(n<0||n>MV.length)return;if(busy){busy=0;bid++}
ix=n;sel=-1;tg=[];pend=null;anim={m:d>0?MV[ix-1]:MV[ix],rev:d<0};render();
if(mode=='bot'&&ix==MV.length&&ST[ix].t!=me&&!R)setTimeout(bot,40)}
function typed(){var v=document.getElementById('mi').value.replace(/\s/g,''),s=ST[ix],L,i,m,c,w=function(z){return z.replace(/[+#x=]/g,'')};
if(!v||R||busy||flag||(mode=='bot'&&s.t!=me))return;L=mvs(s);
for(i=0;i<L.length;i++){m=L[i];c=sq(m.f)+sq(m.t);
if(w(san(s,m,L))==w(v)||v.toLowerCase()==c+(m.p?'xxnbrq'.charAt(m.p):'')||(m.p==5&&v.toLowerCase()==c)){document.getElementById('mi').value='';play(m);return}}
if(perm(s)&&/^[a-h][1-8][a-h][1-8][qrbn]?$/i.test(v)){v=v.toLowerCase();
m=fm(s,(8-+v.charAt(1))*8+'abcdefgh'.indexOf(v.charAt(0)),(8-+v.charAt(3))*8+'abcdefgh'.indexOf(v.charAt(2)),v.length>4?'xxnbrq'.indexOf(v.charAt(4)):0);
if(m){document.getElementById('mi').value='';play(m);return}}
document.getElementById('st1').innerHTML='Illegal move: '+v}

/* ---------- ui ---------- */
function $(i){return document.getElementById(i)}
function fmt(ms){var s=Math.ceil(ms/1000),m=Math.floor(s/60);s=s%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s}
function ic(n){return S?'<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="'+IC[n]+'"/></svg>':AS[n]}
function pc(p){var a=Math.abs(p),w=p>0,z;
